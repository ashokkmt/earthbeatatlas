name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: ghcr.io/stac-utils/pgstac:v0.10.0
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgis
          PGUSER: username
          PGPASSWORD: password
          PGDATABASE: postgis
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h /var/run/postgresql -U username -d postgis"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://username:password@localhost:5432/postgis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run --locked python -m compileall -q src scripts tests
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked python scripts/migrate_catalog.py
      - run: uv run --locked python scripts/import_catalog_seed.py
      - run: uv run --locked python scripts/migrate_catalog.py
      - run: uv run --locked python scripts/import_catalog_seed.py
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: docker compose --env-file infra/cloud/.env.example -f infra/cloud/compose.yaml config -q
      - run: docker build -t earthbeat-api:ci .
      - run: docker build -f infra/cloud/Dockerfile.web -t earthbeat-web:ci .
