[project]
name = "nasa"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "earthaccess>=0.19.0",
    "fastapi>=0.115,<1",
    "h5py>=3.16.0",
    "harmony-py>=1.8.0",
    "httpx>=0.27,<1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2,<4",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "stac-fastapi-pgstac>=7.2,<8",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nasa_explorer"
